spring.application.name=${SPRING_APP_NAME:eazybankbackend}

#spring.security.user.name=${SECURITY_USERNAME:banguela}
#spring.security.user.password=${SECURITY_PASSWORD:guelito}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazybank?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
security.bcrypt.version=2A
security.bcrypt.strength=12
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

# Argon2 DEV
security.password.argon2.memory=19456
security.password.argon2.iterations=2
security.password.argon2.parallelism=1
security.password.argon2.hash-length=32